<!DOCTYPE html>
<html>
    <head>
        <title>Search - WizardLyrics</title>
        <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
        <link rel="icon" href="/favicon.svg">
        <style>html{background-color:#050505;color:#e7e7e7;--accent:#aeffd9;--accent-translucent:#aeffd980;display:flex;justify-content:center;flex-direction:row}body{font-family:'Inter', sans-serif;margin-top:2rem;margin-bottom:0;width:70vw;@media screen and (width <= 900px){width:95vw}}h1{font-family:'Inter', sans-serif;font-size:4.4rem;margin:0;color:var(--accent)}h3{font-family:'Inter', sans-serif}.search-container{display:flex;flex-direction:row;@media screen and (width <= 900px){flex-direction:column}width:100%}button,input{font-size:1.5rem;font-family:inherit;color:inherit;height:44px;padding:0;margin:0;background-color:transparent;border:solid 1px var(--accent);border-radius:8px}button#search{width:15%;margin:1px 1px 1px 3%;background-color:var(--accent);color:#050505;box-shadow:0 0 0 0 transparent;transition:0.3s;@media screen and (width <= 900px){width:90vw;margin:0}}button#search:hover{box-shadow:0 0 4px 4px var(--accent-translucent);cursor:pointer}input#search-bar{width:82%;padding-left:6px;@media screen and (width <= 900px){width:90vw;padding-left:0;margin-bottom:8px}}span#query{color:var(--accent)}.track-item{display:flex;flex-direction:row}a,a:active,a:focus,a:hover{border:none;background:none;font-family:inherit;font-size:inherit;color:inherit;text-decoration:none;outline:none;cursor:pointer}a{margin-bottom:8px}img{width:3rem;height:3rem;border-radius:4px}p{margin:4px 0 0 12px}</style>
        <script>function search(){var q=document.getElementById("search-bar").value;window.location.href=["/search?q=",encodeURIComponent(q)].join("")};window.onload=function(){document.getElementById("search").onclick=search;document.getElementById("search-bar").onkeydown=function(event){if(event.key==="Enter"){search()}}};</script>
    </head>

    <body>
        <h1>Wizard</h1>
        <h3>An open-source, privacy respecting frontend for Genius.</h3>

        <div class="search-container">
            <input type="text" id="search-bar" $BOX>
            <button type="button" id="search">Search</button>
        </div>
        <br>
        <h3>Results for <span id="query">$QUERY</span>:</h3>
        <div class="results-container">
            $SEARCHRESULTS
        </div>
    </body>
</html>
